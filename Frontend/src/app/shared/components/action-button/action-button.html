@if (!showDropdown) {
  <button
    type="{{ type }}"
    class="action-btn action-btn--{{ variant }}"
    [disabled]="disabled"
    (click)="onClick()"
  >
    @if (icon) {
      <mat-icon>{{ icon }}</mat-icon>
    }
    <span>{{ label }}</span>
  </button>
} @else {
  <div class="action-dropdown">
    <button
      type="button"
      class="action-btn action-btn--{{ variant }} action-btn--dropdown"
      [disabled]="disabled"
      (click)="onClick()"
    >
      @if (icon) {
        <mat-icon>{{ icon }}</mat-icon>
      }
      <span>{{ label }}</span>
      <mat-icon class="action-btn__arrow">arrow_drop_down</mat-icon>
    </button>

    @if (isMenuOpen) {
      <div class="action-dropdown__backdrop" (click)="onBackdropClick()"></div>
      <div class="action-dropdown__menu" [class.action-dropdown__menu--up]="menuOpenUp" [style]="menuStyle">
        @for (item of menuItems; track item.action) {
          <button
            type="button"
            class="action-dropdown__item"
            (click)="onMenuItemClick(item.action)"
          >
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </button>
        }
      </div>
    }
  </div>
}
